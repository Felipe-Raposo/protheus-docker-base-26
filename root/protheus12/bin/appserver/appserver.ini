[P12]
SourcePath=/protheus12/apo
RPOCustom=/protheus12/apo/custom.rpo
RootPath=/protheus12/protheus_data
StartPath=/system/
RpoDb=top
RpoLanguage=Multi
RpoVersion=120
LocalFiles=SQLite
TopMemoMega=50

[General]
app_environment=P12
ShowFullLog=0
MaxStringSize=500
MaxQuerySize=31960
PowerSchemeShowUpgradeSuggestion=0
ConsoleLog=1
AsyncConsoleLog=1
BuildKillUsers=1

[Drivers]
Active=TCP
MultiProtocolPort=1
MultiProtocolPortSecure=0

[TCP]
TYPE=TCPIP
Port=1234

[LicenseClient]
Server=license-server
Port=5555

[DBAccess]
Server=dbaccess
Port=7890
ConType=TCPIP
Database={{APPSERVER_DATABASE}}
Alias=protheus

[WebApp]
Port=50001
LastMainProg=sigaadv,sigacfg,apsdu
EnvServer=P12

[WebApp/webapp]
MPP=

[WEBAGENT]
VERSION=1.1.2
Windows_x64=../webagent/web-agent-1.1.2-windows-x64-release.setup.exe
Linux_x64_deb=../webagent/web-agent-1.1.2-linux-x64-release.deb
Linux_x64_rpm=../webagent/web-agent-1.1.2-linux-x64-release.rpm
Darwin_universal=../webagent/web-agent-1.1.2-macos-universal-release.dmg

[HTTPV11]
Enable=1
Sockets=HTTPREST

[HTTPREST]
Port=8080
URIs=HTTPURI
Security=1

[HTTPURI]
URL=/rest
PrepareIn=All
Instances=1,1,1,1

[MPP_CLima]
NewRestOnInit=0
NewRestOnStart=1

[WebMonitor]
Enable=1
SCPingEnabled=0

[APP_MONITOR]
Enable=1
Port=32033
Path=/app-monitor

[ONSTART]
Jobs=HTTPJOB
RefreshRate=20

[HTTPJOB]
Main=HTTP_START
Environment=P12

[HUB]
Enable=0

[SSLConfigure]
Verbose=0
SSL2=0
SSL3=0
TLS1_0=1
TLS1_1=1
TLS1_2=1
TLS1_3=1
State=0
HSM=0

[TDS]
AllowApplyPatch=*
AllowEdit=*
EnableDisconnectUser=*
EnableSendMessage=*
EnableBlockNewConnection=*
EnableStopServer=*
